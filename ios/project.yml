name: AnyWallet
options:
  bundleIdPrefix: com.anywallet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
targets:
  AnyWallet:
    type: application
    platform: iOS
    sources:
      - path: AnyWallet
        excludes:
          - Resources/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anywallet.app
        PRODUCT_NAME: AnyWallet
        INFOPLIST_FILE: AnyWallet/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AnyWalletTests
      gatherCoverageData: true
  AnyWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnyWalletTests
    dependencies:
      - target: AnyWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anywallet.tests
        GENERATE_INFOPLIST_FILE: true
