name: AnyWallet
options:
  bundleIdPrefix: com.anywallet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.8.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    API_BASE_URL: "http://localhost:8787"
    APP_ATTEST_REQUIRED: "NO"
    ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
    ADMOB_INTERSTITIAL_ID: "ca-app-pub-3940256099942544/4411468910"
targets:
  AnyWallet:
    type: application
    platform: iOS
    sources:
      - path: AnyWallet
        excludes:
          - Resources/Preview Content
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eneko.anywallet
        PRODUCT_NAME: AnyWallet
        INFOPLIST_FILE: AnyWallet/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_PREPROCESS: true
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: "ALLOW_INSECURE_HTTP=1"
        Release:
          API_BASE_URL: "https://api.example.invalid"
          APP_ATTEST_REQUIRED: "YES"
          CODE_SIGN_ENTITLEMENTS: AnyWallet/AnyWallet.entitlements
    scheme:
      testTargets:
        - AnyWalletTests
      gatherCoverageData: true
  AnyWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnyWalletTests
    dependencies:
      - target: AnyWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anywallet.tests
        GENERATE_INFOPLIST_FILE: true
